<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в аккаунт</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="brand-mark">JWT</div>
      <p class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</p>
      <h1>С возвращением!</h1>
      <p class="muted">Войдите, чтобы открыть свой профиль.</p>

      <form id="login-form" novalidate>
        <label for="username">Логин</label>
        <input id="username" name="username" type="text" placeholder="Например, emilys" autocomplete="username">
        <small class="field-error" id="username-error"></small>

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" placeholder="Введите пароль" autocomplete="current-password">
        <small class="field-error" id="password-error"></small>

        <p class="form-error" id="form-error" role="alert"></p>
        <button class="primary-button" id="login-button" type="submit">Войти</button>
      </form>
      <div class="demo-hint">
        <span>Тестовый аккаунт</span>
        <strong>emilys / emilyspass</strong>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
